name: Secret scan

# CI is disabled: GitHub Actions billing is permanently off (owner decision
# 2026-05-29) — every job fails at startup. Reduced to manual (workflow_dispatch)
# to stop always-red runs. Secret scanning still runs locally via the pre-commit
# / pre-push gitleaks hooks (.pre-commit-config.yaml, .gitleaks.toml). Restore the
# push/PR triggers below if billing returns.
on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
