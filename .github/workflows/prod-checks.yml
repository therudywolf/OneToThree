name: Production checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: false
          skip-dirs: node_modules,.git,.next,dist,client/.next,client/node_modules,server/node_modules

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: npm audit (high or above fails the job)
        run: npm audit --audit-level=high

  audit-security-design-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: audit-security-lint with STRICT=1 (non-blocking)
        env:
          STRICT: "1"
        run: node scripts/audit-security-lint.mjs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  docker-build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the API image from the repo root so `npm ci` runs strictly
      # against the committed workspace lockfile. Any drift between
      # package-lock.json and server/package.json fails this job instead of
      # being silently papered over at deploy time.
      - name: Build API image
        run: docker build -f server/Dockerfile -t onetothree-api:ci .

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm run android:build:debug
      - uses: actions/upload-artifact@v4
        with:
          name: OneToThree-debug-apk
          path: mobile/capacitor/android/app/build/outputs/apk/debug/app-debug.apk

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forest
          POSTGRES_PASSWORD: forest
          POSTGRES_DB: forest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forest -d forest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://forest:forest@127.0.0.1:5432/forest
      JWT_SECRET: your_ci_jwt_secret_at_least_32_characters_long
      # Both are needed: REDIS_URL points the app at Redis; VITEST_REDIS_URL
      # tells test-setup.ts to keep REDIS_URL instead of forcing the
      # in-memory fallback, so the Redis-backed group-call tests run.
      REDIS_URL: redis://127.0.0.1:6379
      VITEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run db:push
      - run: npm run test:server
      - run: npm run test:unit -w project-13-client
      - run: npm run check:locales
