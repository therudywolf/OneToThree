name: Release (Android + Desktop)

# Triggered by pushing a `v*` tag (e.g. `v0.5.0`, `v1.0.0-rc1`) or manually.
#
# Required GitHub repository secrets:
#   ANDROID_KEYSTORE_BASE64       — base64 of the release .jks file
#   ANDROID_KEYSTORE_PASSWORD     — store password
#   ANDROID_KEY_ALIAS             — key alias inside the keystore
#   ANDROID_KEY_PASSWORD          — key password (often same as store password)
#   RELEASE_NEXT_PUBLIC_API_URL   — e.g. https://api.onetothree.ru
#   RELEASE_NEXT_PUBLIC_APP_URL   — e.g. https://onetothree.ru
#   RELEASE_NEXT_PUBLIC_VAPID_PUBLIC_KEY — VAPID public key for web push
#   RELEASE_NEXT_PUBLIC_TURN_URLS         — comma-separated TURN URIs (optional)
#   RELEASE_NEXT_PUBLIC_TURN_USERNAME     — TURN user (optional)
#   RELEASE_NEXT_PUBLIC_TURN_PASSWORD     — TURN credential (optional)
#
# See docs/RELEASE.md for keystore generation instructions.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (must already exist or will be created)"
        required: true

permissions:
  contents: write

jobs:
  android:
    name: Android signed APK
    runs-on: ubuntu-22.04
    outputs:
      apk_path: ${{ steps.build.outputs.apk_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Synthesize .env.prod from secrets
        env:
          API_URL: ${{ secrets.RELEASE_NEXT_PUBLIC_API_URL }}
          APP_URL: ${{ secrets.RELEASE_NEXT_PUBLIC_APP_URL }}
          VAPID_KEY: ${{ secrets.RELEASE_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          TURN_URLS: ${{ secrets.RELEASE_NEXT_PUBLIC_TURN_URLS }}
          TURN_USER: ${{ secrets.RELEASE_NEXT_PUBLIC_TURN_USERNAME }}
          TURN_PASS: ${{ secrets.RELEASE_NEXT_PUBLIC_TURN_PASSWORD }}
        run: |
          : "${API_URL:?RELEASE_NEXT_PUBLIC_API_URL secret is required}"
          {
            echo "NEXT_PUBLIC_API_URL=$API_URL"
            echo "NEXT_PUBLIC_APP_URL=${APP_URL:-$API_URL}"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=${VAPID_KEY:-}"
            echo "NEXT_PUBLIC_TURN_URLS=${TURN_URLS:-}"
            echo "NEXT_PUBLIC_TURN_USERNAME=${TURN_USER:-}"
            echo "NEXT_PUBLIC_TURN_PASSWORD=${TURN_PASS:-}"
          } > .env.prod

      - name: Restore keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          : "${KS_B64:?ANDROID_KEYSTORE_BASE64 secret is required}"
          mkdir -p "$RUNNER_TEMP/keystore"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/keystore/release.jks"
          test -s "$RUNNER_TEMP/keystore/release.jks" || { echo "keystore decode failed"; exit 1; }
          echo "KEYSTORE_PATH=$RUNNER_TEMP/keystore/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        id: build
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_NO_VERSIONED_COPY: "0"
        run: |
          chmod +x scripts/build-apk.sh
          ./scripts/build-apk.sh release "$KEYSTORE_PATH"
          apk="$(ls releases/android/onetothree-release-*.apk | head -1)"
          test -s "$apk" || { echo "APK not produced"; exit 1; }
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      - name: Shred keystore from runner
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/keystore/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/keystore/release.jks"
          rm -rf "$RUNNER_TEMP/keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            releases/android/onetothree-release*.apk
            releases/android/onetothree-release*.apk.sha256
          retention-days: 30
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-2022
            bundles: msi,nsis
          - platform: macos-14
            bundles: dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/tauri/src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('desktop/tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Install root npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Tauri npm deps
        working-directory: desktop/tauri
        run: npm install --no-audit --no-fund

      - name: Generate icons
        working-directory: desktop/tauri
        run: npx @tauri-apps/cli icon ../../client/public/wolf-logo.png

      - name: Build static frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.RELEASE_NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.RELEASE_NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.RELEASE_NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          NEXT_PUBLIC_TURN_URLS: ${{ secrets.RELEASE_NEXT_PUBLIC_TURN_URLS }}
          NEXT_PUBLIC_TURN_USERNAME: ${{ secrets.RELEASE_NEXT_PUBLIC_TURN_USERNAME }}
          NEXT_PUBLIC_TURN_PASSWORD: ${{ secrets.RELEASE_NEXT_PUBLIC_TURN_PASSWORD }}
        run: npm run build:client:export

      - name: Build Tauri bundles
        working-directory: desktop/tauri
        run: npx @tauri-apps/cli build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          retention-days: 30
          if-no-files-found: error
          path: |
            desktop/tauri/src-tauri/target/release/bundle/**/*.deb
            desktop/tauri/src-tauri/target/release/bundle/**/*.AppImage
            desktop/tauri/src-tauri/target/release/bundle/**/*.msi
            desktop/tauri/src-tauri/target/release/bundle/**/*.exe
            desktop/tauri/src-tauri/target/release/bundle/**/*.dmg

  publish:
    name: Publish GitHub Release
    needs: [android, desktop]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate changelog from previous tag
        id: changelog
        run: |
          prev="$(git describe --tags --abbrev=0 --exclude="${GITHUB_REF_NAME}" 2>/dev/null || true)"
          {
            echo "## OneToThree ${GITHUB_REF_NAME}"
            echo
            if [ -n "$prev" ]; then
              echo "Changes since \`$prev\`:"
              echo
              git log --pretty=format:'- %s' "$prev..HEAD" | grep -vE '^- (chore|docs|ci|test)\(' | head -50 || true
              echo
              echo
              echo "Full diff: https://github.com/${GITHUB_REPOSITORY}/compare/$prev...${GITHUB_REF_NAME}"
            else
              echo "First tagged release."
            fi
          } > CHANGELOG_RELEASE.md
          cat CHANGELOG_RELEASE.md

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          name: OneToThree ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG_RELEASE.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: false
          files: |
            dist/android-release-apk/*.apk
            dist/android-release-apk/*.sha256
            dist/desktop-ubuntu-22.04/**/*.deb
            dist/desktop-ubuntu-22.04/**/*.AppImage
            dist/desktop-windows-2022/**/*.msi
            dist/desktop-windows-2022/**/*.exe
            dist/desktop-macos-14/**/*.dmg
