name: Desktop (Tauri) build

# CI is disabled: GitHub Actions billing is permanently off (owner decision
# 2026-05-29) — every job fails at startup. Reduced to manual (workflow_dispatch)
# to stop always-red runs on every client/desktop push. Restore the push/PR
# triggers below if billing returns.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Attach binaries to a draft GitHub release"
        type: boolean
        default: false
  # push:
  #   branches: [main]
  #   paths:
  #     - "desktop/tauri/**"
  #     - "client/**"
  #     - ".github/workflows/tauri-build.yml"
  # pull_request:
  #   paths:
  #     - "desktop/tauri/**"
  #     - ".github/workflows/tauri-build.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: deb,appimage
          - platform: windows-2022
            bundles: msi,nsis
          # macOS is included so the workflow doubles as a sanity check;
          # disable in `if:` below if you only want Win/Linux artifacts.
          - platform: macos-14
            bundles: dmg

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # 22, like every other job in this repo (release.yml, prod-checks.yml).
      # This one was missed when the others were bumped, and a desktop bundle
      # built on a different major than the APK and the server is a difference
      # nobody would look for while chasing a bug.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/tauri/src-tauri/target
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('desktop/tauri/src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ matrix.platform }}-cargo-

      - name: Linux dependencies (webkit2gtk + bundler)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential

      - name: Install root npm deps
        run: npm ci --no-audit --no-fund

      - name: Install Tauri npm deps
        working-directory: desktop/tauri
        run: npm install --no-audit --no-fund

      # Icons (src-tauri/icons/) are committed, so no generation step is
      # needed — CI builds the same icon set a fresh local checkout uses.

      - name: Build static frontend
        run: npm run build:client:export

      - name: Build Tauri bundles
        working-directory: desktop/tauri
        # macOS signing + notarisation are OPT-IN: with the secrets unset these
        # variables are empty strings and Tauri produces exactly the unsigned
        # bundle it does today. With them set, the .dmg stops being the one
        # Gatekeeper refuses to open by default — which is the single biggest
        # drop-off on the desktop download.
        #
        # Windows Authenticode is NOT wired here: Tauri signs via a certificate
        # thumbprint from the machine store (bundle.windows.certificateThumbprint),
        # which needs the cert imported into the runner first. Left undone rather
        # than half-done, so nobody assumes .exe/.msi are signed.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx @tauri-apps/cli build --bundles ${{ matrix.bundles }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: onetothree-${{ matrix.platform }}
          retention-days: 14
          if-no-files-found: error
          path: |
            desktop/tauri/src-tauri/target/release/bundle/**/*.deb
            desktop/tauri/src-tauri/target/release/bundle/**/*.AppImage
            desktop/tauri/src-tauri/target/release/bundle/**/*.msi
            desktop/tauri/src-tauri/target/release/bundle/**/*.exe
            desktop/tauri/src-tauri/target/release/bundle/**/*.dmg

      - name: Attach to draft release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: OneToThree desktop ${{ github.sha }}
          tag_name: desktop-${{ github.sha }}
          files: |
            desktop/tauri/src-tauri/target/release/bundle/**/*.deb
            desktop/tauri/src-tauri/target/release/bundle/**/*.AppImage
            desktop/tauri/src-tauri/target/release/bundle/**/*.msi
            desktop/tauri/src-tauri/target/release/bundle/**/*.exe
            desktop/tauri/src-tauri/target/release/bundle/**/*.dmg
