<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OneToThree — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b0d11;
        color: #e7ecf4;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(28rem, 92vw);
        border: 1px solid #2a3344;
        border-radius: 16px;
        padding: 20px;
        background: #121826;
      }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0; opacity: 0.85; line-height: 1.45; }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You're offline</h1>
      <p>OneToThree will reconnect automatically. Pending messages stay queued and will be retried when network is back.</p>
    </main>
  </body>
</html>
