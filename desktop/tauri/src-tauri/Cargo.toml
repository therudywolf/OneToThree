[package]
name = "onetothree-tauri"
version = "0.1.0"
description = "OneToThree desktop shell"
authors = ["therudywolf"]
license = "AGPL-3.0-only"
repository = "https://github.com/therudywolf/OneToThree"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onetothree_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
