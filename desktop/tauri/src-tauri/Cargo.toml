[package]
name = "onetothree-tauri"
version = "0.9.0"
description = "OneToThree desktop shell"
authors = ["therudywolf"]
license = "AGPL-3.0-only"
repository = "https://github.com/therudywolf/OneToThree"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "onetothree_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# keyring v3 ships no backend by default — enable one per platform:
#   apple-native        -> macOS / iOS Keychain
#   windows-native      -> Windows Credential Manager
#   sync-secret-service -> Linux Secret Service (GNOME Keyring / KWallet via D-Bus)
#   crypto-rust         -> pure-Rust encrypted-session transport for Secret Service
#                          (required by dbus-secret-service; avoids an OpenSSL system dep)
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
