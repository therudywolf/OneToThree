# OneToThree **Lite** — one-domain (or localhost) self-host stack.
#
# Generated/driven by `.env.lite` (run `node scripts/lite/install.mjs`). Everything
# is served from ONE origin behind Caddy (web + /api + /api/ws), so Lite needs a
# single hostname — or just localhost. The one bundled optional service is pulled
# in only when its feature is enabled, via a compose profile:
#   media  → minio   (photos / voice / files / stickers)
#
#   docker compose -f docker-compose.lite.yml --profile media up -d --build
#
# Calls are NOT bundled: a LiveKit SFU needs coturn + open UDP ports, so Lite
# points the API at a LiveKit you run (OT_LIVEKIT_* in .env.lite) rather than
# shipping one. Enabling calls only sets those env vars — no extra container.
#
# See docs/guides/LITE.md.
name: onetothree-lite

services:
  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: ${OT_DB_PASSWORD:?set in .env.lite}
      POSTGRES_DB: forest
    volumes:
      - lite_pgdata:/var/lib/postgresql/data
    networks: [lite]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: redis-server --save "" --appendonly no --maxmemory 96mb --maxmemory-policy allkeys-lru
    networks: [lite]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [media]
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OT_MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${OT_MINIO_PASSWORD:?set in .env.lite}
      MINIO_API_CORS_ALLOW_ORIGIN: ${OT_ORIGIN}
    volumes:
      - lite_minio:/data
    # Published so the browser can reach presigned object URLs. Local mode uses
    # http://localhost:9000 (OT_S3_PUBLIC_URL); a public domain should front this
    # with its own s3.<domain> — see docs/guides/LITE.md.
    ports:
      # Same OT_BIND as Caddy: in `local` mode the browser reaches MinIO on
      # http://localhost:9000, which hits the same IPv6-accepts-then-hangs trap.
      # Loopback unless the installer decided browsers must reach this port
      # directly (see minioBind in scripts/lite/lite-core.mjs): MinIO here is
      # plain HTTP holding the root credentials from .env.lite.
      - "${OT_MINIO_BIND:-127.0.0.1:}${OT_MINIO_PORT:-9000}:9000"
    networks: [lite]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgres://forest:${OT_DB_PASSWORD}@db:5432/forest
    depends_on:
      db:
        condition: service_healthy
    networks: [lite]

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      NODE_ENV: ${OT_NODE_ENV:-production}
      HOME: /tmp
      PORT: "8080"
      COOKIE_SECURE: ${OT_COOKIE_SECURE:-1}
      CORS_ORIGIN: ${OT_ORIGIN}
      DATABASE_URL: postgres://forest:${OT_DB_PASSWORD}@db:5432/forest
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${OT_JWT_SECRET:?set in .env.lite}
      TOTP_WRAP_KEY: ${OT_TOTP_WRAP_KEY:?set in .env.lite}
      # Feature flags — a disabled feature drops its infra, its UI, and its API
      # routes (all default ON). The installer surfaces MEDIA/CALLS/STICKERS/GIF/
      # PUSH/2FA as checkboxes; ADMIN/GROUPS are env-only (rarely disabled).
      FEATURE_MEDIA: ${OT_ENABLE_MEDIA:-1}
      FEATURE_CALLS: ${OT_ENABLE_CALLS:-0}
      FEATURE_STICKERS: ${OT_ENABLE_STICKERS:-1}
      FEATURE_GIF: ${OT_ENABLE_GIF:-1}
      FEATURE_PUSH: ${OT_ENABLE_PUSH:-0}
      FEATURE_2FA: ${OT_ENABLE_2FA:-1}
      FEATURE_ADMIN: ${OT_ENABLE_ADMIN:-1}
      FEATURE_GROUPS: ${OT_ENABLE_GROUPS:-1}
      # Open registration: on a public domain this is the difference between
      # "my friends and I" and "anyone who finds the URL". The server has always
      # honoured FEATURE_OPEN_REGISTRATION, but Lite never passed it, so a
      # self-hoster had no way to close sign-ups at all.
      FEATURE_OPEN_REGISTRATION: ${OT_ENABLE_OPEN_REGISTRATION:-1}
      # Guest links are OPT-IN (the only unauthenticated app surface), so this
      # one defaults to 0 and is enabled only when explicitly ticked.
      FEATURE_GUESTS: ${OT_ENABLE_GUESTS:-0}
      # First admin. On boot the API promotes this account to the `creator`
      # group, but ONLY while the instance has no creator — so it is inert on
      # every later start. It never creates the account: register in the app
      # first. Without it the only way to get an admin panel on a fresh Lite
      # install was hand-written SQL inside the db container.
      ADMIN_BOOTSTRAP_USERNAME: ${OT_ADMIN_USERNAME:-}
      # Media (only used when media is on).
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${OT_S3_PUBLIC_URL:-http://localhost:9000}
      MINIO_ROOT_USER: ${OT_MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${OT_MINIO_PASSWORD:-}
      MINIO_BUCKET: onetothree-media
      MINIO_ACCESS_KEY: ${OT_MINIO_USER:-minio}
      MINIO_SECRET_KEY: ${OT_MINIO_PASSWORD:-}
      # Push (only used when push is on).
      VAPID_PUBLIC_KEY: ${OT_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${OT_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${OT_VAPID_SUBJECT:-mailto:admin@localhost}
      # Calls (only used when calls is on).
      #
      # CALL_MEDIA_MODE has to be stated. The server defaults to `origin_safe`,
      # and in that mode /call/config reports `livekit_enabled: false` no matter
      # what the three vars below hold — while the client checks `origin_safe`
      # FIRST and takes the WebSocket audio relay without ever looking at the
      # SFU. So an operator who filled in a LiveKit URL, key and secret got them
      # silently ignored. The installer sets this to `self_hosted` when a
      # LiveKit URL is configured and leaves it `origin_safe` otherwise.
      #
      # `self_hosted` without coturn is deliberate here: /ice-servers 503s, and
      # a failed ICE fetch is exactly how a 1:1 call falls back to the same
      # encrypted WebSocket relay. Group calls get the SFU, 1:1 keeps the relay.
      CALL_MEDIA_MODE: ${OT_CALL_MEDIA_MODE:-origin_safe}
      LIVEKIT_URL: ${OT_LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${OT_LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${OT_LIVEKIT_API_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks: [lite]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Same-origin: the client derives API_URL = <origin>/api and the socket
        # = <origin>/api/ws, both fronted by Caddy → api.
        NEXT_PUBLIC_API_URL: ${OT_ORIGIN}
        NEXT_PUBLIC_APP_URL: ${OT_ORIGIN}
        NEXT_PUBLIC_WS_ORIGIN: ""
        NEXT_PUBLIC_DR_ENABLED: "1"
        API_INTERNAL_URL: http://api:8080
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [lite]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # infra/lite/Caddyfile is written by the installer for your mode:
    #   local  → Caddy listens :80 (http, localhost)         → OT_HTTP_PORT:80
    #   lan    → Caddy listens :OT_HTTPS_PORT (self-signed)   → OT_HTTPS_PORT:OT_HTTPS_PORT
    #   domain → Caddy listens :80 + :443 (Let's Encrypt)     → 80:80 + 443:443
    # OT_HTTPS_CONTAINER_PORT lets `lan` map the host HTTPS port 1:1 to the port
    # Caddy actually listens on (so the site address host:port matches exactly).
    #
    # OT_BIND pins `local` mode to 127.0.0.1. Two reasons, and the first is not
    # theoretical: published with no host, Docker Desktop also listens on `[::]`,
    # and on Windows that IPv6 listener ACCEPTS the connection and then answers
    # nothing. `localhost` resolves to ::1 first, so the very URL the installer
    # prints gave the browser ERR_EMPTY_RESPONSE — and because the socket was
    # accepted rather than refused, nothing falls back to IPv4. Second: `local`
    # means this machine only, so not publishing it to the network is the point.
    # `lan` and `domain` leave OT_BIND empty and stay on 0.0.0.0.
    ports:
      - "${OT_BIND:-}${OT_HTTP_PORT:-80}:80"
      - "${OT_BIND:-}${OT_HTTPS_PORT:-443}:${OT_HTTPS_CONTAINER_PORT:-443}"
    volumes:
      - ./infra/lite/Caddyfile:/etc/caddy/Caddyfile:ro
      - lite_caddy_data:/data
      - lite_caddy_config:/config
    depends_on:
      - web
      - api
    networks: [lite]

volumes:
  lite_pgdata:
  lite_minio:
  lite_caddy_data:
  lite_caddy_config:

networks:
  lite:
    driver: bridge
