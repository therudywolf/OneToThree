# =============================================================================
# Project 13 — production (high-throughput host: ~4 cores / 6GB+ RAM class)
# :: Caddy is the ONLY service binding 80/443 — TLS via Let's Encrypt (see Caddyfile)
# :: ACME certs persist in volume caddy_data (/data); config autosave in caddy_config (/config)
# :: Launch: ./setup.sh
# :: Volume upgrade: if you used `postgres_data`, rename/migrate to `pgdata` or
#    keep the old volume name by editing the db service volume line below.
# =============================================================================

services:
  db:
    image: postgres:alpine
    restart: always
    cpu_shares: 512
    cpus: '1.0'
    mem_limit: 512m
    mem_reservation: 128m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-forest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: always
    cpu_shares: 384
    cpus: '2.0'
    mem_limit: 512m
    mem_reservation: 128m
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.prod}
    volumes:
      - minio_data:/data
    networks:
      - app_network
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    restart: 'no'
    cpu_shares: 256
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-forest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-forest}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=128m
    cpu_shares: 512
    cpus: '4.0'
    mem_limit: 1024m
    mem_reservation: 256m
    expose:
      - '8080'
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOME: /tmp
      PORT: '8080'
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: postgres://${POSTGRES_USER:-forest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-forest}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://onetothree.ru}
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Next.js embeds NEXT_PUBLIC_* at build time from .env.prod (see args below). TURN ICE must use a
  # dedicated DNS name (e.g. turn.onetothree.ru), not api.* — see coturn comments (Cloudflare / UDP).
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.onetothree.ru}
        NEXT_PUBLIC_WS_ORIGIN: ${NEXT_PUBLIC_WS_ORIGIN:-https://api.onetothree.ru}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_TURN_URL: ${NEXT_PUBLIC_TURN_URL:-}
        NEXT_PUBLIC_TURN_USERNAME: ${NEXT_PUBLIC_TURN_USERNAME:-}
        NEXT_PUBLIC_TURN_PASSWORD: ${NEXT_PUBLIC_TURN_PASSWORD:-}
    restart: always
    cpu_shares: 512
    cpus: '4.0'
    mem_limit: 1536m
    mem_reservation: 512m
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok||r.status===307||r.status===308?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  # TURN relay for WebRTC (symmetric NAT). Uses host networking so UDP relay ports are not
  # behind Docker NAT. Open 3478/tcp+udp and 49152-65535/udp on the host firewall.
  #
  # CRITICAL (Cloudflare): If the zone uses Cloudflare, create a dedicated hostname (e.g.
  # turn.onetothree.ru) pointing at this server's IP and set it to "DNS only" (gray cloud).
  # Orange-cloud proxy does not support the UDP traffic TURN needs; api.* and apex can stay proxied.
  # Set NEXT_PUBLIC_TURN_URL=turn:turn.onetothree.ru:3478 in .env.prod — not the api. host.
  coturn:
    image: coturn/coturn:latest
    restart: always
    network_mode: host
    env_file:
      - .env.prod
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49152
      - --max-port=65535
      - --lt-cred-mech
      - --fingerprint
      - --realm=onetothree.ru
      - --user=${TURN_USERNAME:?set TURN_USERNAME in .env.prod}:${TURN_PASSWORD:?set TURN_PASSWORD in .env.prod}

  caddy:
    image: caddy:2-alpine
    restart: always
    cpu_shares: 256
    cpus: '1.0'
    mem_limit: 256m
    mem_reservation: 64m
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network

volumes:
  pgdata:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  app_network:
    driver: bridge
