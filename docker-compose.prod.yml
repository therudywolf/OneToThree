# =============================================================================
# Project 13 — production (high-throughput host: ~4 cores / 6GB+ RAM class)
# :: Caddy is the ONLY service binding 80/443 — TLS via Let's Encrypt (see Caddyfile)
# :: ACME certs persist in volume caddy_data (/data); config autosave in caddy_config (/config)
# :: Launch: ./setup.sh
# :: Volume upgrade: if you used `postgres_data`, rename/migrate to `pgdata` or
#    keep the old volume name by editing the db service volume line below.
# =============================================================================
name: forestmessenger

services:
  db:
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c statement_timeout=30000
      -c idle_in_transaction_session_timeout=60000
      -c max_connections=50
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 2048
    mem_limit: 512m
    mem_reservation: 128m
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-forest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    extra_hosts:
      - '${DOMAIN:-onetothree.ru}:host-gateway'
      - 'api.${DOMAIN:-onetothree.ru}:host-gateway'
      - 's3.${DOMAIN:-onetothree.ru}:host-gateway'
      - 'turn.${DOMAIN:-onetothree.ru}:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    cpu_shares: 2048
    mem_limit: 128m
    mem_reservation: 32m
    networks:
      - internal
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 2048
    mem_limit: 512m
    mem_reservation: 128m
    command: server /data --console-address ':9001'
    secrets:
      - minio_root_password
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - internal
      - edge
    extra_hosts:
      - '${DOMAIN:-onetothree.ru}:host-gateway'
      - 'api.${DOMAIN:-onetothree.ru}:host-gateway'
      - 's3.${DOMAIN:-onetothree.ru}:host-gateway'
      - 'turn.${DOMAIN:-onetothree.ru}:host-gateway'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    restart: 'no'
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 256
    secrets:
      - postgres_password
    environment:
      # DATABASE_URL is assembled by migrate.sh from POSTGRES_PASSWORD_FILE —
      # never pass the password as a plaintext env var.
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_DB: ${POSTGRES_DB:-forest}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    extra_hosts:
      - '${DOMAIN:-onetothree.ru}:host-gateway'
      - 'api.${DOMAIN:-onetothree.ru}:host-gateway'
      - 's3.${DOMAIN:-onetothree.ru}:host-gateway'
      - 'turn.${DOMAIN:-onetothree.ru}:host-gateway'

  api:
    # Built from the repo root so the server installs from the authoritative
    # workspace lockfile (root package-lock.json) — see server/Dockerfile.
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-}
        BUILT_AT: ${BUILT_AT:-}
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=128m
    cpu_shares: 1024
    mem_limit: 1024m
    mem_reservation: 256m
    expose:
      - '8080'
    # The api process runs as the non-root "app" user (uid 1001). Compose does
    # NOT honour uid/gid/mode for file-based secrets, so the host-side secret
    # files are chmod 0644 — the secrets/ directory itself stays 0700, so the
    # files remain protected at the host level while the bind-mounted copies at
    # /run/secrets/* stay readable by the non-root app user. Without that the
    # app silently falls back to the plaintext .env.prod env_file copy.
    secrets:
      - jwt_secret
      - webhook_secret
      - postgres_password
      - minio_root_password
      - turn_password
      - livekit_api_key
      - livekit_api_secret
      - cloudflare_turn_key_id
      - cloudflare_turn_api_token
      - totp_wrap_key
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOME: /tmp
      PORT: '8080'
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # DATABASE_URL is assembled by server/src/db/index.ts via readSecret('POSTGRES_PASSWORD') —
      # never pass the password as a plaintext env var.
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_DB: ${POSTGRES_DB:-forest}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      TURN_PASSWORD_FILE: /run/secrets/turn_password
      TURN_URLS: ${TURN_URLS:-}
      # LiveKit SFU — api/call/token reads these via readSecret().
      LIVEKIT_API_KEY_FILE: /run/secrets/livekit_api_key
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      # Cloudflare Calls TURN — preferred TURN source (orange-cloud compatible).
      # Both are optional: if either is missing, /api/ice-servers falls back
      # to self-hosted coturn, then to public STUN-only.
      CLOUDFLARE_TURN_KEY_ID_FILE: /run/secrets/cloudflare_turn_key_id
      CLOUDFLARE_TURN_API_TOKEN_FILE: /run/secrets/cloudflare_turn_api_token
      TOTP_WRAP_KEY_FILE: /run/secrets/totp_wrap_key
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - internal
      - edge
    extra_hosts:
      - '${DOMAIN:-onetothree.ru}:host-gateway'
      - 'api.${DOMAIN:-onetothree.ru}:host-gateway'
      - 's3.${DOMAIN:-onetothree.ru}:host-gateway'
      - 'turn.${DOMAIN:-onetothree.ru}:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Next.js embeds NEXT_PUBLIC_* at build time from .env.prod (see args below). TURN ICE must use a
  # dedicated DNS name (e.g. turn.DOMAIN), not api.* — see coturn comments (Cloudflare / UDP).
  # All NEXT_PUBLIC_* are set by startup.sh from the DOMAIN secret — no fallback needed here.
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
        NEXT_PUBLIC_WS_ORIGIN: ${NEXT_PUBLIC_WS_ORIGIN:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL:-}
        MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-}
        NEXT_PUBLIC_DR_ENABLED: ${NEXT_PUBLIC_DR_ENABLED:-1}
        # Must match the api's APP_VERSION build arg — /api/version is compared
        # against this to offer the "new build, reload" banner.
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-dev}
        # Target for Next's same-origin /api/* rewrite (next.config.js). Baked at
        # build (rewrites serialize into routes-manifest) AND kept as runtime ENV
        # by the Dockerfile. Must be the internal api service — the web container's
        # localhost has no API. Empty here => onetothree.ru/api/* 500s with
        # ECONNREFUSED 127.0.0.1:8080 (the Next proxy can't reach the API).
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 1024
    mem_limit: 1536m
    mem_reservation: 512m
    expose:
      - '3000'
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - edge
    extra_hosts:
      - '${DOMAIN:-onetothree.ru}:host-gateway'
      - 'api.${DOMAIN:-onetothree.ru}:host-gateway'
      - 's3.${DOMAIN:-onetothree.ru}:host-gateway'
      - 'turn.${DOMAIN:-onetothree.ru}:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok||r.status===307||r.status===308?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  # TURN relay for WebRTC (symmetric NAT). Uses host networking so UDP relay
  # ports are not behind Docker NAT.
  #
  # Firewall checklist (host):
  #   - TCP 3478, 5349 (STUN/TURN + TURNS).
  #   - UDP 3478 for STUN.
  #   - UDP 49160-49200 for RELAY media. Must be NOT blocked by Cloudflare Proxy.
  #   - Do not advertise turns:*:443 in the default one-host deploy: Caddy owns
  #     host :443. Use turns:*:5349 unless you run TURN on a separate :443 IP.
  #
  # CRITICAL (Cloudflare): create hostname `turn.onetothree.ru` pointing at
  # this server's IP and set it to "DNS only" (gray cloud). Orange-cloud proxy
  # drops UDP and blocks TURN. Apex + api.* can remain orange.
  #
  # TLS material (for turns:// fallback on 5349) is copied from the Caddy
  # ACME volume into ./docker/coturn/tls by scripts/sync-turn-certs.sh or
  # ./startup.sh turn-sync. coturn starts without TLS until those files exist.
  coturn:
    # Drop all Linux capabilities: coturn binds only high ports (3478/5349 and
    # the 49152-65535 relay range — all >1024, so NET_BIND_SERVICE is not
    # needed) and runs as root without dropping to another OS user, so it needs
    # no capabilities. Mirrors db/redis/minio hardening. A live relay call MUST
    # be re-verified after deploy.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: coturn/coturn:4.13.1
    restart: unless-stopped
    network_mode: host
    user: root
    cpu_shares: 2048
    mem_limit: 128m
    # NO env_file here, deliberately. coturn is configured entirely through the
    # `command:` args below, which docker compose interpolates from .env.prod on
    # the HOST — the entrypoint reads no environment at all, and coturn does not
    # substitute ${VAR} in turnserver.conf. Mounting the whole .env.prod into
    # this container therefore bought nothing while handing JWT_SECRET, the
    # Postgres password, the MinIO keys, TOTP_WRAP_KEY and the VAPID private key
    # to a process that runs as root on the host network. Blast radius only.
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/coturn/tls:/etc/coturn/tls:ro
      - ./docker/coturn/entrypoint.sh:/usr/local/bin/forest-coturn-entrypoint.sh:ro
    entrypoint: ['/usr/local/bin/forest-coturn-entrypoint.sh']
    # entrypoint adds --no-tls automatically when certs are absent.
    # The sync script restarts coturn when it copies changed certificate material.
    command:
      - --log-file=stdout
      - --realm=${TURN_REALM:-${DOMAIN:-onetothree.ru}}
      - --user=${TURN_USERNAME:-turn}:${TURN_PASSWORD:?set TURN_PASSWORD in .env.prod}
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env.prod}
    healthcheck:
      # STUN probe on 3478/udp — confirms the daemon is reachable.
      test:
        [
          'CMD-SHELL',
          'timeout 3 bash -c ">/dev/tcp/127.0.0.1/3478" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # LiveKit SFU — selective forwarding unit for 3+ participants / low-latency
  # video. Uses host networking because WebRTC requires a wide UDP range and
  # ICE/TCP fallback on :7881. Caddy terminates TLS for the WSS signaling
  # endpoint at wss://lk.onetothree.ru and proxies it to livekit:7880.
  #
  # LiveKit v1.8 does not expand ${VAR} inside livekit.yaml, so the
  # entrypoint wrapper builds the LIVEKIT_KEYS env from the mounted Docker
  # secrets before exec'ing the server binary.  This keeps the api key /
  # secret out of .env.prod entirely.
  livekit:
    # Drop all Linux capabilities: the SFU binds only high ports (7880 signaling,
    # 7881 ICE/TCP, and the UDP media range — all >1024) and the distroless image
    # already runs as a non-root user, so it needs no capabilities. Mirrors
    # db/redis/minio hardening. A live SFU group call MUST be re-verified after
    # deploy.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    image: livekit/livekit-server:v1.13.1
    restart: unless-stopped
    network_mode: host
    cpu_shares: 2048
    mem_limit: 256m
    secrets:
      - livekit_api_key
      - livekit_api_secret
    environment:
      LIVEKIT_API_KEY_FILE: /run/secrets/livekit_api_key
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      # Advertise ONLY the public IP as an ICE candidate — entrypoint.sh passes
      # this as --node-ip. Interpolated from .env (the same public IP coturn
      # uses via TURN_EXTERNAL_IP). Without it, host networking makes LiveKit
      # advertise every docker bridge as a bogus candidate.
      LIVEKIT_NODE_IP: ${TURN_EXTERNAL_IP:-}
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
      - ./docker/livekit/entrypoint.sh:/usr/local/bin/forest-entrypoint.sh:ro
    entrypoint: ['/usr/local/bin/forest-entrypoint.sh']
    command: ['--config', '/etc/livekit.yaml']
    # Image is distroless/minimal: no bash; idle mode has no listener on :7880.
    # Rely on restart policy; group calls fall back to P2P/TURN when SFU is down.
    healthcheck:
      disable: true

  # caddy: REMOVED — reverse proxy переехал в ~/infra/caddy (infra-caddy контейнер).
  # Не добавляй сюда caddy: — конфликт за порты 80/443.

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_password:
    file: ./secrets/minio_root_password
  jwt_secret:
    file: ./secrets/jwt_secret
  webhook_secret:
    file: ./secrets/webhook_secret
  turn_password:
    file: ./secrets/turn_password
  livekit_api_key:
    file: ./secrets/livekit_api_key
  livekit_api_secret:
    file: ./secrets/livekit_api_secret
  cloudflare_turn_key_id:
    file: ./secrets/cloudflare_turn_key_id
  cloudflare_turn_api_token:
    file: ./secrets/cloudflare_turn_api_token
  totp_wrap_key:
    file: ./secrets/totp_wrap_key

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  internal:
    driver: bridge
  edge:
    external: true
    name: edge
