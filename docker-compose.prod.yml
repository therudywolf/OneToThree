# =============================================================================
# Project 13 — production (high-throughput host: ~4 cores / 6GB+ RAM class)
# :: Caddy is the ONLY service binding 80/443 — TLS via Let's Encrypt (see Caddyfile)
# :: ACME certs persist in volume caddy_data (/data); config autosave in caddy_config (/config)
# :: Launch: ./setup.sh
# :: Volume upgrade: if you used `postgres_data`, rename/migrate to `pgdata` or
#    keep the old volume name by editing the db service volume line below.
# =============================================================================
name: forestmessenger

services:
  db:
    image: postgres:16-alpine
    restart: always
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c statement_timeout=30000
      -c idle_in_transaction_session_timeout=60000
      -c max_connections=50
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 512
    cpus: '1.0'
    mem_limit: 512m
    mem_reservation: 128m
    secrets:
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-forest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network
    extra_hosts:
      - 'onetothree.ru:host-gateway'
      - 'api.onetothree.ru:host-gateway'
      - 's3.onetothree.ru:host-gateway'
      - 'turn.onetothree.ru:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --appendonly yes --loglevel warning
    cpu_shares: 256
    cpus: '0.5'
    mem_limit: 128m
    mem_reservation: 32m
    networks:
      - app_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 384
    cpus: '2.0'
    mem_limit: 512m
    mem_reservation: 128m
    command: server /data --console-address ':9001'
    secrets:
      - minio_root_password
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    volumes:
      - minio_data:/data
    networks:
      - app_network
    extra_hosts:
      - 'onetothree.ru:host-gateway'
      - 'api.onetothree.ru:host-gateway'
      - 's3.onetothree.ru:host-gateway'
      - 'turn.onetothree.ru:host-gateway'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  db-migrate:
    build:
      context: .
      dockerfile: docker/db-migrate/Dockerfile
    restart: 'no'
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 256
    secrets:
      - postgres_password
    environment:
      # DATABASE_URL is assembled by migrate.sh from POSTGRES_PASSWORD_FILE —
      # never pass the password as a plaintext env var.
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_DB: ${POSTGRES_DB:-forest}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    extra_hosts:
      - 'onetothree.ru:host-gateway'
      - 'api.onetothree.ru:host-gateway'
      - 's3.onetothree.ru:host-gateway'
      - 'turn.onetothree.ru:host-gateway'

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=128m
    cpu_shares: 512
    cpus: '4.0'
    mem_limit: 1024m
    mem_reservation: 256m
    expose:
      - '8080'
    secrets:
      - jwt_secret
      - webhook_secret
      - postgres_password
      - minio_root_password
      - turn_password
      - livekit_api_key
      - livekit_api_secret
      - cloudflare_turn_key_id
      - cloudflare_turn_api_token
      - totp_wrap_key
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      HOME: /tmp
      PORT: '8080'
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # DATABASE_URL is assembled by server/src/db/index.ts via readSecret('POSTGRES_PASSWORD') —
      # never pass the password as a plaintext env var.
      POSTGRES_USER: ${POSTGRES_USER:-forest}
      POSTGRES_DB: ${POSTGRES_DB:-forest}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://onetothree.ru}
      MINIO_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
      TURN_PASSWORD_FILE: /run/secrets/turn_password
      TURN_URLS: ${TURN_URLS:-}
      # LiveKit SFU — api/call/token reads these via readSecret().
      LIVEKIT_API_KEY_FILE: /run/secrets/livekit_api_key
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      # Cloudflare Calls TURN — preferred TURN source (orange-cloud compatible).
      # Both are optional: if either is missing, /api/ice-servers falls back
      # to self-hosted coturn, then to public STUN-only.
      CLOUDFLARE_TURN_KEY_ID_FILE: /run/secrets/cloudflare_turn_key_id
      CLOUDFLARE_TURN_API_TOKEN_FILE: /run/secrets/cloudflare_turn_api_token
      TOTP_WRAP_KEY_FILE: /run/secrets/totp_wrap_key
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app_network
    extra_hosts:
      - 'onetothree.ru:host-gateway'
      - 'api.onetothree.ru:host-gateway'
      - 's3.onetothree.ru:host-gateway'
      - 'turn.onetothree.ru:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Next.js embeds NEXT_PUBLIC_* at build time from .env.prod (see args below). TURN ICE must use a
  # dedicated DNS name (e.g. turn.onetothree.ru), not api.* — see coturn comments (Cloudflare / UDP).
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.onetothree.ru}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://onetothree.ru}
        NEXT_PUBLIC_WS_ORIGIN: ${NEXT_PUBLIC_WS_ORIGIN:-https://api.onetothree.ru}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_GIPHY_API_KEY: ${NEXT_PUBLIC_GIPHY_API_KEY:-}
        MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://s3.onetothree.ru}
        NEXT_PUBLIC_DR_ENABLED: ${NEXT_PUBLIC_DR_ENABLED:-1}
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    cpu_shares: 512
    cpus: '4.0'
    mem_limit: 1536m
    mem_reservation: 512m
    expose:
      - '3000'
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app_network
    extra_hosts:
      - 'onetothree.ru:host-gateway'
      - 'api.onetothree.ru:host-gateway'
      - 's3.onetothree.ru:host-gateway'
      - 'turn.onetothree.ru:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok||r.status===307||r.status===308?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 90s

  # TURN relay for WebRTC (symmetric NAT). Uses host networking so UDP relay
  # ports are not behind Docker NAT.
  #
  # Firewall checklist (host):
  #   - TCP 3478, 5349 (STUN/TURN + TURNS).
  #   - UDP 3478 for STUN.
  #   - UDP 49160-49200 for RELAY media. Must be NOT blocked by Cloudflare Proxy.
  #
  # CRITICAL (Cloudflare): create hostname `turn.onetothree.ru` pointing at
  # this server's IP and set it to "DNS only" (gray cloud). Orange-cloud proxy
  # drops UDP and blocks TURN. Apex + api.* can remain orange.
  #
  # TLS material (for turns:// fallback on 5349) is the same certificate
  # Caddy obtains via ACME — we mount `caddy_data` read-only and point coturn
  # at the Let's Encrypt `current/` directory.
  coturn:
    image: coturn/coturn:4.6
    restart: always
    network_mode: host
    user: root
    env_file:
      - .env.prod
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/coturn/tls:/etc/coturn/tls:ro
    command:
      - -n
      - --log-file=stdout
      - --realm=${TURN_REALM:-onetothree.ru}
      - --user=${TURN_USERNAME:-turn}:${TURN_PASSWORD:?set TURN_PASSWORD in .env.prod}
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in .env.prod}
    healthcheck:
      # STUN probe on 3478/udp — confirms the daemon is reachable.
      test:
        [
          'CMD-SHELL',
          'timeout 3 bash -c ">/dev/tcp/127.0.0.1/3478" || exit 1',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # LiveKit SFU — selective forwarding unit for 3+ participants / low-latency
  # video. Uses host networking because WebRTC requires a wide UDP range and
  # ICE/TCP fallback on :7881. Caddy terminates TLS for the WSS signaling
  # endpoint at wss://lk.onetothree.ru and proxies it to livekit:7880.
  #
  # LiveKit v1.8 does not expand ${VAR} inside livekit.yaml, so the
  # entrypoint wrapper builds the LIVEKIT_KEYS env from the mounted Docker
  # secrets before exec'ing the server binary.  This keeps the api key /
  # secret out of .env.prod entirely.
  livekit:
    image: livekit/livekit-server:v1.8
    restart: always
    network_mode: host
    secrets:
      - livekit_api_key
      - livekit_api_secret
    environment:
      LIVEKIT_API_KEY_FILE: /run/secrets/livekit_api_key
      LIVEKIT_API_SECRET_FILE: /run/secrets/livekit_api_secret
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
      - ./docker/livekit/entrypoint.sh:/usr/local/bin/forest-entrypoint.sh:ro
    entrypoint: ['/usr/local/bin/forest-entrypoint.sh']
    command: ['--config', '/etc/livekit.yaml']
    # Image is distroless/minimal: no bash; idle mode has no listener on :7880.
    # Rely on restart policy; group calls fall back to P2P/TURN when SFU is down.
    healthcheck:
      disable: true

  caddy:
    image: caddy:2-alpine
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    cpu_shares: 256
    cpus: '1.0'
    mem_limit: 256m
    mem_reservation: 64m
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app_network
    extra_hosts:
      - 'onetothree.ru:host-gateway'
      - 'api.onetothree.ru:host-gateway'
      - 's3.onetothree.ru:host-gateway'
      - 'turn.onetothree.ru:host-gateway'
      # lk.onetothree.ru is reverse-proxied to livekit (host network, :7880)
      # through host.docker.internal — required on Linux VPS, no-op on Docker
      # Desktop where it's auto-provided.
      - 'host.docker.internal:host-gateway'

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  minio_root_password:
    file: ./secrets/minio_root_password
  jwt_secret:
    file: ./secrets/jwt_secret
  webhook_secret:
    file: ./secrets/webhook_secret
  turn_password:
    file: ./secrets/turn_password
  livekit_api_key:
    file: ./secrets/livekit_api_key
  livekit_api_secret:
    file: ./secrets/livekit_api_secret
  cloudflare_turn_key_id:
    file: ./secrets/cloudflare_turn_key_id
  cloudflare_turn_api_token:
    file: ./secrets/cloudflare_turn_api_token
  totp_wrap_key:
    file: ./secrets/totp_wrap_key

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  app_network:
    driver: bridge
