services:
  db:
    image: postgres:alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    environment:
      POSTGRES_USER: forest
      POSTGRES_PASSWORD: forest
      POSTGRES_DB: forest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forest -d forest"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret_change_me
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOME: /tmp
      PORT: "8080"
      CORS_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://forest:forest@db:5432/forest
      JWT_SECRET: ${JWT_SECRET:-dev-change-in-production}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio_secret_change_me
      MINIO_BUCKET: project13-media
      MINIO_ACCESS_KEY: minio
      MINIO_SECRET_KEY: minio_secret_change_me
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "3000:3000"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8080
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    working_dir: /app
    command:
      - sh
      - -c
      - |
        npm install
        exec npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
  web_next:

networks:
  app:
    driver: bridge
