# Build context is this directory (project root). Use `.` — not `..` — so the image sees package.json.
services:
  nocturne-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - nocturne_node_modules:/app/node_modules
      - nocturne_next:/app/.next
    env_file:
      - .env.local
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    working_dir: /app
    command:
      - sh
      - -c
      - |
        npm install
        exec npm run dev -- --hostname 0.0.0.0 --port 3000

volumes:
  nocturne_node_modules:
  nocturne_next:
