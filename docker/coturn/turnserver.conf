# ------------------------------------------------------------------
# coturn (Project 13) — hardened configuration.
#
# Layout:
#   - Listens on 3478 UDP/TCP for plain TURN (gated by time-limited credentials).
#   - Listens on 5349 TCP with TLS (turns:). The default one-host deploy keeps
#     :443 on Caddy, so clients should use turns:<turn-host>:5349 unless an
#     operator intentionally provides a separate :443 TURN listener.
#   - Relay port range is 49160..49200 (narrow for easier host firewalling).
#     Widen only if you expect more than ~20 concurrent calls per relay.
#
# Authentication — TURN REST API ("time-limited credentials"):
#   The api hands each signed-in user the username "<expiry-unix>:<user id>" and
#   the password HMAC-SHA1(secret, username); coturn recomputes it, and refuses
#   a username whose expiry has passed. There is NO shared password anywhere in
#   this stack — what a client is given stops working after
#   TURN_CREDENTIAL_TTL_SEC (default 2 h) and says nothing about the secret.
#   The secret is NOT in this file (the file is committed): the entrypoint reads
#   the Docker secret `turn_auth_secret` and appends `static-auth-secret=…` to a
#   runtime copy of this file that lives on a tmpfs. See entrypoint.sh.
#
# Cert sourcing:
#   Certificate and private key must exist at /etc/coturn/tls/fullchain.pem and
#   /etc/coturn/tls/privkey.pem inside the container. The entrypoint starts
#   without TLS until scripts/sync-turn-certs.sh copies them from Caddy.
# ------------------------------------------------------------------

listening-port=3478
tls-listening-port=5349
tcp-listening-port=3478

# Time-limited credentials. `use-auth-secret` already implies long-term
# authentication, so anonymous TURN stays impossible — do not add `lt-cred-mech`
# back (together they only log a warning) and do not add `user=` lines: a static
# account is a password every client that ever asked the api learns.
use-auth-secret
fingerprint

# No RFC 6062 TCP allocations. They are how a TURN user opens TCP connections
# FROM the relay — i.e. reaches TCP services on the host the relay runs on.
# Browsers never ask for them (their TURN over TCP/TLS is the client→server leg,
# which stays on), so nothing legitimate is lost.
no-tcp-relay

# Realm is set via the command-line flag `--realm=` in docker-compose.prod.yml
# (coturn does not perform ${VAR} substitution on config lines).  Leaving it
# out here means the CLI override is the single source of truth.

# Relay port range (narrow so the host firewall table stays short).
min-port=49160
max-port=49200

# Hardening: refuse private / loopback / multicast peers — prevents using the
# TURN relay to reach LAN services. Verified against coturn 4.13.1 with
# scripts/turn-probe.mjs: CreatePermission must answer 403 AND a datagram sent
# through the relay must not arrive.
#   - Loopback (127.0.0.0/8, ::1, ::ffff:127.0.0.1), IPv6 link-local and ULA are
#     refused by coturn itself; the explicit 127/8 range below is belt and braces.
#   - `no-loopback-peers` below is what coturn <= 4.5 called that switch; 4.13
#     logs "Bad configuration format" for it and ignores it. Kept so an older
#     pinned image stays safe.
#   - The IPv4 private ranges are NOT refused by default — the list below is
#     what protects them.
#
# The server's OWN public address is deliberately NOT on this list. A relay-only
# call (the api answers `transportPolicy: relay`) is relay <-> relay: both legs
# end on this coturn, so each leg's peer IS this host's public address.
# Denying it makes every such call fail with "403 Forbidden IP" on
# CreatePermission — measured, not assumed. Its TCP half is closed by
# `no-tcp-relay` above; what remains (UDP to services bound on the public
# address) and the host-firewall rule that closes it without touching calls are
# described in docs/OPS.md → "TURN relay hardening". An operator whose clients
# never relay through this host can opt in with TURN_DENIED_PEER_IPS
# (see entrypoint.sh) — IPv6 own address is safe to add either way.
no-loopback-peers
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# TLS material (mount from Caddy's Let's Encrypt volume).
cert=/etc/coturn/tls/fullchain.pem
pkey=/etc/coturn/tls/privkey.pem
# Modern TLS only — no SSL v3 / TLS 1.0 / 1.1.
no-tlsv1
no-tlsv1_1
# STUN CVE-2020-26262 mitigation: require username on STUN/TURN.
stale-nonce=600

# Operational hygiene.
no-stdout-log
simple-log
pidfile=/var/run/turnserver.pid

# Do not allow the server to be used as an open STUN reflector.
# (coturn >= 4.13 starts with the CLI off unless --cli is given and logs a
# deprecation line for this option; kept so an older pinned image stays safe.)
no-cli
