listening-port=3478
tcp-listening-port=3478
fingerprint
lt-cred-mech
# Realm should match your domain
realm=${TURN_REALM:-onetothree.ru}
# External IP must be set via TURN_EXTERNAL_IP env var or Docker compose command
# external-ip is passed via docker-compose command-line to avoid hardcoding
min-port=49152
max-port=65535
no-stdout-log
no-loopback-peers
no-multicast-peers
