# LiveKit SFU configuration (Project 13)
#
# References:
#   https://docs.livekit.io/home/self-hosting/deployment/
#   https://docs.livekit.io/realtime/network/
#
# Notes on ports:
#   7880 — HTTP + WebSocket signaling (reverse-proxied by Caddy).
#   7881 — TCP fallback for WebRTC transport (used when UDP is blocked).
#   50000-50100 UDP — media. Must be reachable from clients; keep the range
#     narrow (100 ports ≈ 50 concurrent calls).

port: 7880
bind_addresses:
  - ''

rtc:
  # Single-port UDP mux: only UDP 50000 must be open in the firewall (plus the
  # TCP 7881 fallback). Simpler than a port range and enough for the SFU mux.
  # NB: do NOT also set port_range_start/end — combining them with udp_port made
  # LiveKit log `rtc.portUDP {Start:50000,End:0}` and skip binding the UDP mux.
  udp_port: 50000
  tcp_port: 7881
  # Advertise ONLY the public IP as an ICE candidate. entrypoint.sh injects it
  # as `--node-ip` from TURN_EXTERNAL_IP. With host networking, auto-detect
  # (use_external_ip: true) enumerates every docker bridge (172.x/192.168.x) as a
  # bogus candidate, slowing ICE and spamming "could not validate external IP".
  use_external_ip: false
  # ICE over TCP (7881) helps when only :443-style outbound works; LiveKit
  # multiplexes the TCP port with signaling.
  #
  # NB: `ice_lite` was removed from `config.RTCConfig` in LiveKit v1.8 —
  # including it causes `could not parse config: yaml: unmarshal errors:
  # field ice_lite not found`. Modern LiveKit always behaves as the full ICE
  # agent; there is no longer a knob to flip. Leaving a comment for posterity.

# NOTE: `keys:` is intentionally omitted.  LiveKit v1.8 reads this YAML
# literally (no ${VAR} substitution), so keys are injected at runtime via
# the LIVEKIT_KEYS environment variable — see docker/livekit/entrypoint.sh,
# which composes it from the mounted Docker secrets.

logging:
  level: info
  json: false
  sample: true

# Redis omitted on purpose: single-node LiveKit uses in-process state. Pointing
# redis at 127.0.0.1:6379 on host networking fails when Redis only listens on
# the Docker bridge (compose `redis` service). For multi-node, set redis.address
# to a reachable host:port and deploy a shared Redis.

# Room defaults.
room:
  auto_create: true
  empty_timeout: 300
  max_participants: 16

turn:
  enabled: false
  # If you want LiveKit's built-in TURN instead of coturn, set enabled: true
  # and move the turns:// listener from coturn. We stick with coturn so the
  # messenger doesn't depend on LiveKit for 1-to-1 fallback.
