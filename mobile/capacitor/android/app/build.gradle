apply plugin: 'com.android.application'

// Repo-root VERSION is the single source of truth for the app version.
// CI / release tooling may still override with -PVERSION_NAME / -PVERSION_CODE.
def repoVersionName = '0.0.0'
try {
    def versionFile = new File(rootProject.projectDir, '../../../VERSION')
    if (versionFile.exists()) {
        def raw = versionFile.text.trim()
        if (raw) { repoVersionName = raw }
    }
} catch (Exception e) {
    logger.warn("Could not read repo VERSION file, falling back to ${repoVersionName}")
}
// Derive a monotonic integer versionCode from MAJOR.MINOR.PATCH of the semver
// (pre-release suffix like "-alpha.1" is ignored for the code).
def repoVersionCode = 1
try {
    def m = (repoVersionName =~ /^(\d+)\.(\d+)\.(\d+)/)
    if (m.find()) {
        repoVersionCode = m.group(1).toInteger() * 10000 +
                          m.group(2).toInteger() * 100 +
                          m.group(3).toInteger()
        if (repoVersionCode < 1) { repoVersionCode = 1 }
    }
} catch (Exception e) {
    logger.warn("Could not derive versionCode from '${repoVersionName}', using ${repoVersionCode}")
}

android {
    def versionCodeProp = project.findProperty('VERSION_CODE')?.toString()
    def versionNameProp = project.findProperty('VERSION_NAME')?.toString()
    namespace = "ru.onetothree.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ru.onetothree.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeProp ? Integer.parseInt(versionCodeProp) : repoVersionCode
        versionName versionNameProp ?: repoVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // NB: local var names must NOT match the signingConfig DSL setters
            // (storePassword / keyAlias / keyPassword). A same-named `def` shadows
            // the setter, so Groovy tries to *call* the String value and fails with
            // "No signature of method: java.lang.String.call()". Use distinct names.
            def storeFilePath = project.findProperty('RELEASE_STORE_FILE')
            def storePass = project.findProperty('RELEASE_STORE_PASSWORD')
            def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS')
            def keyPass = project.findProperty('RELEASE_KEY_PASSWORD')
            if (storeFilePath && storePass && releaseKeyAlias && keyPass) {
                storeFile file(storeFilePath)
                storePassword storePass
                keyAlias releaseKeyAlias
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
